name: Actualizar datos y publicar
on:
  schedule: [{cron: "30 21 * * 1-5"}]  # 15:30 hora de la Ciudad de México (UTC-6), después del cierre
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Banxico
        run: python3 scripts/fetch_banxico.py
        env: {BANXICO_TOKEN: "${{ secrets.BANXICO_TOKEN }}"}
      - name: Comparativo
        run: pip -q install yfinance pandas && python3 scripts/fetch_comparativo.py
        env: {BANXICO_TOKEN: "${{ secrets.BANXICO_TOKEN }}"}
      - name: Fibras
        run: python3 scripts/fetch_fibras.py
      - name: Datos del dia
        run: pip -q install matplotlib && python3 scripts/datos_del_dia.py
        env: {BANXICO_TOKEN: "${{ secrets.BANXICO_TOKEN }}"}
      - name: Commit datos
        if: github.event_name != 'push'
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add data/banxico.json data/comparativo.json data/fibras_precios.json
          git commit -m "Datos Banxico y precios de FIBRAs" || exit 0
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
